<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="行程规划 - 轻松规划你的完美旅程">
  <meta name="theme-color" content="#6366f1">
  <title>行程规划 - Travel Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="10" r="3"/><path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 7 8 11.7z"/>
        </svg>
        <span class="brand-text">Travel Planner</span>
      </a>
      <div class="topbar-actions">
        <button class="btn-ghost" id="btnThemePicker" title="切换主题">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <span class="btn-label">主题</span>
        </button>
        <button class="btn-ghost" id="btnSavedPlans" title="已保存的行程">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
          <span class="btn-label">行程</span>
        </button>
        <button class="btn-ghost" id="btnNewPlan" title="新建行程">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span class="btn-label">新建</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主内容 -->
  <main id="mainContent"></main>

  <!-- 添加行程项弹窗（二级菜单） -->
  <div class="modal" id="addItemModal">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-add">
      <div class="modal-add-header">
        <h3>添加到 Day <span id="addItemDayNum">1</span></h3>
        <button class="modal-close" id="btnAddItemClose">&times;</button>
      </div>

      <!-- 二级菜单 -->
      <div class="type-tabs" id="typeTabs">
        <button class="type-tab active" data-type="attraction">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 7 8 11.7z"/></svg>景点
        </button>
        <button class="type-tab" data-type="transport">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>交通
        </button>
        <button class="type-tab" data-type="accommodation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21v-9a9 9 0 0 1 18 0v9"/><path d="M3 10V3h18v7"/><rect x="7" y="10" width="3" height="4"/><rect x="14" y="10" width="3" height="4"/></svg>住宿
        </button>
      </div>

      <!-- === 景点面板 === -->
      <div class="modal-panel" id="attractionOptions"></div>

      <!-- === 交通面板 === -->
      <div class="modal-panel" id="transportOptions" style="display:none">
        <!-- 路径规划 -->
        <p style="font-size:.85rem;color:var(--c-text-2);margin-bottom:12px">选择已添加的地点作为起终点，规划出行路线</p>
        <div class="route-planner" id="routePlanner">
          <div class="form-row-2">
            <div class="form-group">
              <label>出发地</label>
              <select id="routeFrom" class="route-select"><option value="">选择已添加的地点</option></select>
            </div>
            <div class="form-group">
              <label>目的地</label>
              <select id="routeTo" class="route-select"><option value="">选择已添加的地点</option></select>
            </div>
          </div>
          <div class="travel-mode-tabs">
            <button class="mode-tab active" data-mode="driving">&#128663; 驾车</button>
            <button class="mode-tab" data-mode="transit">&#128652; 公交</button>
            <button class="mode-tab" data-mode="walking">&#128099; 步行</button>
            <button class="mode-tab" data-mode="riding">&#128690; 骑行</button>
            <button class="mode-tab" data-mode="train">&#128646; 高铁</button>
            <button class="mode-tab" data-mode="plane">&#9992; 飞机</button>
          </div>
          <button class="btn btn-primary btn-block" id="btnSearchRoute" disabled>搜索路线</button>
          <div class="route-result" id="routeResult" style="display:none"></div>
        </div>
      </div>

      <!-- === 住宿面板 === -->
      <div class="modal-panel" id="accommodationOptions" style="display:none"></div>

      <!-- 地图选点 + 时间费用（景点/住宿共用） -->
      <div id="extraSection" style="display:none">
        <div class="map-pick-section" id="mapPickSection">
          <div class="map-pick-header">
            <span>&#128506; 在地图上选点（可选）</span>
            <button class="btn btn-sm btn-outline" id="btnOpenMapPicker">打开地图</button>
          </div>
          <div class="map-coords-display" id="mapCoordsDisplay" style="display:none">
            <span class="coord-badge" id="coordBadge">已选位置</span>
            <button class="btn-item-sm delete" id="btnClearCoords">&times;</button>
          </div>
        </div>
        <div class="item-extra" id="itemExtraFields">
          <div class="form-row-2">
            <div class="form-group"><label>时间</label><input type="time" id="itemTime"></div>
            <div class="form-group"><label>预估费用 (¥)</label><input type="number" id="itemCost" placeholder="0" min="0" step="0.01"></div>
          </div>
          <div class="form-group"><label>备注</label><input type="text" id="itemNote" placeholder="可选备注信息"></div>
        </div>
        <button class="btn btn-primary btn-block" id="btnAddAttraction" style="margin-top:12px">确认添加景点</button>
        <button class="btn btn-primary btn-block" id="btnAddAccommodation" style="display:none;margin-top:12px">确认添加住宿</button>
      </div>
    </div>
  </div>

  <!-- 地图选点弹窗 -->
  <div class="modal" id="mapPickerModal">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-map">
      <div class="modal-add-header">
        <h3>&#128506; 选择位置</h3>
        <button class="modal-close" id="btnMapPickerClose">&times;</button>
      </div>
      <div class="map-search-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon-s">
          <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="mapSearchInput" placeholder="搜索地点..." autocomplete="off">
        <button class="btn btn-sm btn-outline" id="btnMapLocate" title="定位到我的位置">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>
        </button>
      </div>
      <div class="map-search-results" id="mapSearchResults"></div>
      <div id="mapContainer" class="map-container"></div>
      <div class="map-picked-info" id="mapPickedInfo" style="display:none">
        <span id="mapPickedName"></span>
        <span class="map-picked-coords" id="mapPickedCoords"></span>
      </div>
      <button class="btn btn-primary btn-block" id="btnMapConfirm" disabled>在地图上点击选择位置，或搜索后选择</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="modal" id="themeModal">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-themes">
      <div class="modal-add-header">
        <h3>&#127912; 选择主题色</h3>
        <button class="modal-close" id="btnThemeClose">&times;</button>
      </div>
      <div class="theme-grid" id="themeGrid"></div>
    </div>
  </div>

  <!-- 行程列表弹窗 -->
  <div class="modal" id="savedPlansModal">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-plans">
      <div class="modal-add-header">
        <h3>已保存的行程</h3>
        <button class="modal-close" id="btnPlansClose">&times;</button>
      </div>
      <div class="plans-list" id="plansList"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 底部移动端 TabBar -->
  <nav class="mobile-tabbar" id="mobileTabbar">
    <button class="tabbar-item active" data-tab="planner">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>行程</span>
    </button>
    <button class="tabbar-item" data-tab="save">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span>保存</span>
    </button>
  </nav>

  <!-- HTML removed: Leaflet CSS & JS, replaced with AMap JS SDK v2 -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/map-config.js"></script>
  <script src="js/map-service.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
